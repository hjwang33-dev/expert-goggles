<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家庭聊天通话</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
        body{background:#f5f5f5;max-width:600px;margin:0 auto;padding:10px}
        .box{background:#fff;border-radius:12px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
        h2{text-align:center;color:#07c160;margin-bottom:15px;font-size:20px}
        .id-box{background:#e8f8ef;padding:12px;border-radius:8px;margin-bottom:12px;text-align:center}
        .my-id{font-size:28px;font-weight:bold;color:#07c160;letter-spacing:4px;margin:8px 0}
        .tip{font-size:13px;color:#666;line-height:1.6}
        input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:18px;text-align:center;margin-bottom:10px}
        button{width:100%;padding:13px;border:none;border-radius:8px;font-size:17px;cursor:pointer;margin:5px 0;font-weight:500}
        .btn-green{background:#07c160;color:#fff}
        .btn-green:active{background:#06ad56}
        .btn-blue{background:#1989fa;color:#fff}
        .btn-red{background:#ee0a24;color:#fff}
        .chat-area{height:300px;overflow-y:auto;padding:10px;background:#f9f9f9;border-radius:8px;margin-bottom:10px}
        .msg{margin:8px 0;padding:10px 14px;border-radius:18px;max-width:78%;font-size:16px;line-height:1.5}
        .msg-me{background:#95ec69;margin-left:auto;border-bottom-right-radius:5px}
        .msg-other{background:#fff;margin-right:auto;border-bottom-left-radius:5px;border:1px solid #eee}
        .status{font-size:14px;color:#666;text-align:center;padding:8px}
        .status.ok{color:#07c160;font-weight:500}
        audio{width:100%;margin-top:10px;border-radius:8px}
        .hidden{display:none!important}
        .ring{animation:ring 1s infinite}
        @keyframes ring{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
    </style>
</head>
<body>
    <div class="box">
        <h2>👨‍👩‍👧‍👦 家庭聊天通话</h2>
        <div class="id-box">
            <div>我的房间号</div>
            <div class="my-id" id="myId">-----</div>
            <div class="tip">把上面6位数字发给家人 → 让他们输入并连接你</div>
        </div>
        <input type="text" id="remoteId" placeholder="请输入家人的6位房间号" maxlength="6">
        <button class="btn-green" id="connectBtn" onclick="startConnect()">🔗 连接家人</button>
        <div class="status" id="status">等待连接...</div>
    </div>
    <div class="box hidden" id="incomingBox">
        <h2>📞 来电啦！</h2>
        <div style="text-align:center;margin:15px 0;font-size:18px;">来自房间号：<span id="callerId"></span></div>
        <button class="btn-green ring" onclick="acceptCall()">✅ 接听</button>
        <button class="btn-red" onclick="rejectCall()">❌ 挂断</button>
    </div>
    <div class="box hidden" id="callBox">
        <audio id="audio" autoplay playsinline>
        <div style="text-align:center;margin:10px 0;font-size:16px;color:#1989fa;" id="callStatus">📞 通话中...</div>
        <button class="btn-blue" id="micBtn" onclick="toggleMic()">🔇 静音</button>
        <button class="btn-red" onclick="hangUp()">📵 挂断</button>
    </div>
    <div class="box hidden" id="chatBox">
        <div class="chat-area" id="chatArea"></div>
        <input type="text" id="msgInput" placeholder="说点什么..." onkeypress="if(event.keyCode===13)sendMsg()">
        <button class="btn-green" onclick="sendMsg()">✉️ 发送消息</button>
    </div>
<script>
const RTC_CONFIG={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]};
const SIGNAL_API="https://api.hastebin.com/documents";
let myRoomId,peerId=null,conn=null,channel=null,localStream=null,isMuted=false,pollTimer=null,offerData=null;
window.onload=function(){myRoomId=Math.floor(Math.random()*900000+100000).toString();document.getElementById("myId").textContent=myRoomId;pollIncoming();};
async function startConnect(){peerId=document.getElementById("remoteId").value.trim();if(!/^\d{6}$/.test(peerId))return alert("请输入正确的6位房间号");setStatus("正在连接...");document.getElementById("connectBtn").disabled=true;await createConnection();channel=conn.createDataChannel("family-chat");setupChannel();const offer=await conn.createOffer();await conn.setLocalDescription(offer);offerData={from:myRoomId,type:"offer",sdp:btoa(JSON.stringify(offer))};await sendSignalToPeer(peerId,offerData);setStatus("请求已发送，等待对方接听...");}
async function createConnection(){conn=new RTCPeerConnection(RTC_CONFIG);conn.onicecandidate=async e=>{if(e.candidate&&offerData){offerData.candidate=btoa(JSON.stringify(e.candidate));await sendSignalToPeer(peerId,offerData);}};conn.ontrack=e=>{document.getElementById("audio").srcObject=e.streams[0];document.getElementById("callBox").classList.remove("hidden");};conn.ondatachannel=e=>{channel=e.channel;setupChannel();};try{localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:false});localStream.getTracks().forEach(track=>conn.addTrack(track,localStream));}catch{alert("⚠️ 请允许麦克风权限！");throw e;}}
function setupChannel(){channel.onopen=()=>{setStatus("✅ 连接成功！",true);document.getElementById("chatBox").classList.remove("hidden");};channel.onmessage=e=>{addMsg(e.data,false);};channel.onclose=()=>{setStatus("连接已断开");hideAllUI();};}
async function pollIncoming(){try{const r=await fetch(`https://api.hastebin.com/documents/${myRoomId}`);if(r.ok){const d=await r.json();if(d&&d.content){const sig=JSON.parse(atob(d.content));if(sig.type==="offer"&&sig.from){peerId=sig.from;offerData=sig;document.getElementById("callerId").textContent=peerId;document.getElementById("incomingBox").classList.remove("hidden");}}}}catch(e){}pollTimer=setTimeout(pollIncoming,2000);}
async function acceptCall(){document.getElementById("incomingBox").classList.add("hidden");setStatus("正在接通...");await createConnection();const remoteOffer=JSON.parse(atob(offerData.sdp));await conn.setRemoteDescription(new RTCSessionDescription(remoteOffer));const answer=await conn.createAnswer();await conn.setLocalDescription(answer);const ansData={from:myRoomId,type:"answer",sdp:btoa(JSON.stringify(answer))};await sendSignalToPeer(peerId,ansData);}
function rejectCall(){document.getElementById("incomingBox").classList.add("hidden");peerId=null;offerData=null;}
async function sendSignalToPeer(targetId,data){await fetch(SIGNAL_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:targetId,content:btoa(JSON.stringify(data))})});}
function sendMsg(){const t=document.getElementById("msgInput").value.trim();if(!t||!channel||channel.readyState!=="open"){alert("请先连接再发消息~");return;}channel.send(t);addMsg(t,true);document.getElementById("msgInput").value="";}
function addMsg(t,isMe){const area=document.getElementById("chatArea");const d=document.createElement("div");d.className=`msg ${isMe?"msg-me":"msg-other"}`;d.textContent=t;area.appendChild(d);area.scrollTop=area.scrollHeight;}
function toggleMic(){if(!localStream)return;isMuted=!isMuted;localStream.getAudioTracks()[0].enabled=!isMuted;document.getElementById("micBtn").textContent=isMuted?"🔊 取消静音":"🔇 静音";}
function hangUp(){if(conn)conn.close();if(localStream)localStream.getTracks().forEach(t=>t.stop());conn=channel=localStream=null;isMuted=false;peerId=offerData=null;hideAllUI();clearTimeout(pollTimer);document.getElementById("connectBtn").disabled=false;setStatus("已挂断，可重新连接");pollIncoming();}
function setStatus(t,ok=false){const s=document.getElementById("status");s.textContent=t;s.className=`status ${ok?"ok":""}`;}
function hideAllUI(){document.getElementById("callBox").classList.add("hidden");document.getElementById("chatBox").classList.add("hidden");}
</script>
</body>
</html>
